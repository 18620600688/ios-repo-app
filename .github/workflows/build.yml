name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS device (SwiftPM cross-compile)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TOOLCHAIN_BIN=$(dirname "$(xcrun -f swift)")
          cat > destination.json <<EOF
          {
            "version": 1,
            "toolchain-bin-dir": "$TOOLCHAIN_BIN",
            "sdk": "$SDK",
            "target": "arm64-apple-ios14.0",
            "extra-cc-flags": ["-isysroot", "$SDK"],
            "extra-swiftc-flags": ["-sdk", "$SDK", "-target", "arm64-apple-ios14.0", "-Xlinker", "-syslibroot", "-Xlinker", "$SDK", "-Xlinker", "-rpath", "-Xlinker", "/usr/lib/swift"],
            "extra-cpp-flags": [],
            "dynamic-library-extension": ".dylib"
          }
          EOF
          BIN_PATH=$(swift build -c release --destination destination.json --show-bin-path)
          echo "bin-path: $BIN_PATH"
          swift build -c release --destination destination.json
          BIN="$BIN_PATH/RepoServerApp"
          echo "--- verify platform (must show iphoneos) ---"
          file "$BIN"
          vtool -show-build "$BIN" 2>/dev/null || true
          echo "BIN_PATH=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Assemble IPA
        run: |
          set -e
          BIN="$BIN_PATH/RepoServerApp"
          APP=Payload/RepoServer.app
          mkdir -p "$APP"
          cp "$BIN" "$APP/RepoServerApp"
          chmod +x "$APP/RepoServerApp"
          cp AppInfo/Info.plist "$APP/Info.plist"
          rm -f RepoServer.ipa
          zip -qry RepoServer.ipa Payload
          echo "--- ipa contents (must contain Payload/) ---"
          unzip -l RepoServer.ipa
          unzip -l RepoServer.ipa | grep -q "Payload/RepoServer.app/" || { echo "::error::IPA missing Payload/ layer"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -q UIFileSharingEnabled || echo "::warning::UIFileSharingEnabled missing"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoServer-ipa
          path: RepoServer.ipa

      - name: Publish as release asset (anonymous download)
        run: |
          set -e
          TAG="ipa-$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" RepoServer.ipa \
            --repo "${{ github.repository }}" \
            --title "RepoServer iOS IPA ($TAG)" \
            --notes "自动构建：本地越狱源 App（最低 iOS 14），支持个人热点地址显示"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
